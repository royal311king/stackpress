services:
  stackpress:
    build: .
    container_name: stackpress
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:../data/stackpress.db"
      STACKPRESS_APP_URL: "http://localhost:3000"
      STACKPRESS_STORAGE_ROOT: "./storage"
      STACKPRESS_LOG_ROOT: "./logs"
      STACKPRESS_DATA_ROOT: "./data"
      STACKPRESS_TIMEZONE: "America/Chicago"
      STACKPRESS_SECRET_KEY: "${STACKPRESS_SECRET_KEY}"
      STACKPRESS_ADMIN_USERNAME: "${STACKPRESS_ADMIN_USERNAME:-admin}"
      STACKPRESS_ADMIN_PASSWORD: "${STACKPRESS_ADMIN_PASSWORD}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}"
      GOOGLE_OAUTH_REDIRECT_URI: "${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:3000/api/cloud-storage/google/callback}"
      STACKPRESS_INSTALLATION_NAME: "${STACKPRESS_INSTALLATION_NAME:-}"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./logs:/app/logs
      - /Users/m1-homelab-apps/docker/wp/sites:/mnt/wp-sites
      - /Volumes/M1-HL-BAKUP/--- LOCAL WEBSITE BACKUPS ---:/mnt/wp-backups
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
